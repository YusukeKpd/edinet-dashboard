[project]
name = "edinet-dashboard"
version = "0.1.0"
description = "EDINET API v2 から上場企業の財務データを取得・蓄積し、スクリーニングと企業比較を行うダッシュボード"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- EDINET API 取得 ---
    "requests>=2.32",
    "tenacity>=9.0",        # 指数バックオフ付きリトライ (仕様書 3.3)
    # --- 処理・保存 ---
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17.0",        # Parquet 入出力
    "pyyaml>=6.0",          # config/mapping.yaml
    "python-dotenv>=1.0",   # .env
    # --- ダッシュボード ---
    "streamlit>=1.49",     # width="stretch"（use_container_width は廃止済み）
    "plotly>=5.24",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
# アプリケーションであってライブラリではないため、ビルド/インストールは行わない
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "app"]  # app/ 配下は Streamlit と同じく `from lib import ...` で読む

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# app/lib は Streamlit から `from lib import ...` で読むため、自前のコードとして並べる
known-first-party = ["etl", "lib"]
