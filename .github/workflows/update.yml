# EDINET財務データの定期更新（仕様書 §7.1）
# 重い処理はすべてここで実行する。Streamlit 側では ETL を実行しない。
name: update

on:
  schedule:
    # UTC 日曜 21:00 = JST 月曜 6:00
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "APIを叩かず facts から financials/metrics を再生成する（mapping.yaml 変更時）"
        type: boolean
        default: false
      backfill:
        description: "バックフィルモード"
        type: boolean
        default: false
      date_from:
        description: "取得開始日 YYYY-MM-DD（バックフィル時）"
        type: string
        required: false
      date_to:
        description: "取得終了日 YYYY-MM-DD（バックフィル時）"
        type: string
        required: false

# 多重実行防止。実行中のものはキャンセルせず待たせる
concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: write # Releases(tag: data-latest) への書き込み

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 6月下旬の提出集中期を考慮
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # TODO(フェーズ2 ステップ10): 下のプレースホルダを実際の ETL 実行に置き換える
