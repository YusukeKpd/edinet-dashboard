# EDINET財務データの定期更新（仕様書 §7.1）
# 重い処理はすべてここで実行する。Streamlit 側では ETL を実行しない。
#
# 状態（DuckDB）は毎回まっさらな環境に作り直される。ETL は Releases(data-latest) の
# Parquet から復元して差分だけを取り、終わったら Releases を上書きする。
name: update

on:
  schedule:
    # UTC 日曜 21:00 = JST 月曜 6:00
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "APIを叩かず facts から financials/metrics を再生成する（mapping.yaml 変更時）"
        type: boolean
        default: false
      backfill:
        description: "バックフィルモード"
        type: boolean
        default: false
      date_from:
        description: "取得開始日 YYYY-MM-DD（バックフィル時）"
        type: string
        required: false
      date_to:
        description: "取得終了日 YYYY-MM-DD（バックフィル時）"
        type: string
        required: false

# 多重実行防止。実行中のものはキャンセルせず待たせる
concurrency:
  group: etl
  cancel-in-progress: false

permissions:
  contents: write # Releases(tag: data-latest) への書き込み

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 6月下旬の提出集中期を考慮
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # ETL より先に落としておく。壊れたコードでデータを上書きしないため
      - name: Run tests
        run: uv run pytest

      # 週次なので、1〜7日に走る回がその月の初回になる（仕様書 §7.3）
      - name: Decide whether monthly maintenance runs
        id: schedule
        run: |
          if [ "$(date -u +%d)" -le 07 ]; then
            echo "monthly=true" >> "$GITHUB_OUTPUT"
          else
            echo "monthly=false" >> "$GITHUB_OUTPUT"
          fi

      # Releasesから復元 -> 差分取得 -> パース -> 再計算 -> Releases上書き（仕様書 §7.1）。
      # 状態は Releases にしか無いので、復元と公開は同じ1回の実行で完結させる
      - name: Run ETL
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          MONTHLY: ${{ steps.schedule.outputs.monthly == 'true' && '--monthly-maintenance' || '' }}
          REBUILD: ${{ inputs.rebuild && '--rebuild' || '' }}
          BACKFILL: ${{ inputs.backfill && '--backfill' || '' }}
          DATE_FROM: ${{ inputs.date_from && format('--date-from {0}', inputs.date_from) || '' }}
          DATE_TO: ${{ inputs.date_to && format('--date-to {0}', inputs.date_to) || '' }}
        run: |
          uv run python -m etl.run --restore --publish \
            $MONTHLY $REBUILD $BACKFILL $DATE_FROM $DATE_TO

      - name: Summarize
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: uv run python -m etl.release_io --status >> "$GITHUB_STEP_SUMMARY"
